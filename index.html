<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMRS — Spring Manufacturing Dashboard</title>
    <meta name="description" content="Intelligent Manufacturer Resource System for Spring & Spring Washer Manufacturing" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:sans-serif;"><h3>Application Crash</h3><p>' + e.message + '</p><pre>' + (e.error ? e.error.stack : '') + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:sans-serif;"><h3>Unhandled Promise Rejection</h3><p>' + e.reason + '</p></div>';
      });
    </script>
  </body>
</html>
